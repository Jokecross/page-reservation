<title>Réserve ton appel — Anthony Sirius</title>
<meta name="description" content="Laisse tes coordonnées : un membre de l’équipe d’Anthony Sirius t’appelle.">
<meta name="theme-color" content="#050607">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preload" href="/fonts/anton-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/poppins-400.woff2" as="font" type="font/woff2" crossorigin>
<script defer src="/_vercel/insights/script.js"></script>

<style>
/* ============================================================
   Demande d'appel avec l'équipe d'Anthony (élèves Skool) : un
   formulaire, le lead tombe dans les Leads du jour du CRM.
   Même charte que la page de vente (design.md) : un rouge, un
   noir, un blanc ; Anton à la place de Blackheat, Poppins à la
   place de Nexa.
   ============================================================ */
@font-face{font-family:'Anton';font-weight:400;font-style:normal;font-display:swap;src:url(/fonts/anton-400.woff2) format('woff2')}
@font-face{font-family:'Poppins';font-weight:400;font-style:normal;font-display:swap;src:url(/fonts/poppins-400.woff2) format('woff2')}
@font-face{font-family:'Poppins';font-weight:600;font-style:normal;font-display:swap;src:url(/fonts/poppins-600.woff2) format('woff2')}

:root{
  --rouge:#AE0000;
  --noir:#050607;
  --blanc:#FFFFFF;
  --texte-2:rgba(255,255,255,.68);
  --texte-3:rgba(255,255,255,.48);
  --surface:rgba(255,255,255,.035);
  --surface-2:rgba(255,255,255,.06);
  --bord:rgba(255,255,255,.10);
  --bord-2:rgba(255,255,255,.18);
  --font-display:'Anton', Impact, 'Arial Narrow', sans-serif;
  --font-ui:'Poppins', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --gouttiere:16px;
  --rayon:4px;
}
@media (min-width:768px){ :root{ --gouttiere:32px; } }

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--noir);color:var(--blanc);font:400 16px/1.6 var(--font-ui);-webkit-font-smoothing:antialiased;min-height:100vh}
h1,h2,p{margin:0}
button,input,select{font:inherit;color:inherit}
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.page{max-width:640px;margin:0 auto;padding:40px var(--gouttiere) 64px}

/* ---------- En-tête ---------- */
.tete{text-align:center}
.profil{width:84px;height:84px;margin:0 auto;border-radius:50%;overflow:hidden;background:var(--surface-2);border:2px solid var(--rouge)}
.profil img{width:100%;height:100%;object-fit:cover;display:block}
.etiquette{margin-top:18px;font-size:12px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--texte-2)}
h1{margin-top:10px;font-family:var(--font-display);font-weight:400;text-transform:uppercase;font-size:clamp(34px, 9vw, 52px);line-height:1.16;letter-spacing:.005em}
.aplat{color:var(--blanc);padding:0 .14em;background:linear-gradient(var(--rouge),var(--rouge)) 0 50% / 100% .92em no-repeat;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.chapo{margin-top:12px;color:var(--texte-2);font-size:15px}

/* ---------- La carte ---------- */
.carte{margin-top:28px;padding:22px 18px;border:1px solid var(--bord);background:var(--surface);border-radius:var(--rayon)}
@media (min-width:560px){ .carte{padding:28px} }
.carte h2{font-family:var(--font-display);font-weight:400;text-transform:uppercase;font-size:24px;line-height:1.16;letter-spacing:.01em}

/* ---------- Formulaire ---------- */
form{margin-top:20px}
.deux{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.champ{margin-bottom:16px}
.champ > label{display:block;margin-bottom:8px;font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase}
.saisie{display:block;width:100%;height:52px;padding:0 14px;border-radius:2px;background:var(--surface-2);border:1px solid var(--bord-2);color:var(--blanc);font:400 16px var(--font-ui);-webkit-appearance:none;appearance:none}
.saisie::placeholder{color:var(--texte-3)}
.saisie:focus{outline:none;border-color:var(--blanc);box-shadow:inset 3px 0 0 var(--rouge)}
.saisie.invalide{border-color:var(--rouge);box-shadow:inset 3px 0 0 var(--rouge)}
.saisie:-webkit-autofill{-webkit-text-fill-color:var(--blanc);box-shadow:0 0 0 1000px #111214 inset}
.tel{display:grid;grid-template-columns:112px minmax(0,1fr);gap:8px}
select.saisie{cursor:pointer;padding-right:30px;
  background-image:linear-gradient(45deg,transparent 50%,var(--blanc) 50%),linear-gradient(135deg,var(--blanc) 50%,transparent 50%);
  background-position:calc(100% - 18px) 23px,calc(100% - 13px) 23px;background-size:5px 5px;background-repeat:no-repeat}
select.saisie option{background:var(--noir)}
.indice{margin-top:7px;font-size:13px;color:var(--texte-3)}
.consent{display:flex;gap:12px;align-items:flex-start;margin-top:6px;cursor:pointer;font-size:13px;line-height:1.55;color:var(--texte-2)}
.consent input{width:20px;height:20px;flex:none;margin:1px 0 0;accent-color:var(--rouge)}
.consent a{color:var(--blanc);text-decoration:underline;text-underline-offset:2px}
.consent.manque span{color:var(--blanc)}
.consent.manque input{outline:2px solid var(--rouge);outline-offset:2px}
.hp{position:absolute;left:-10000px;width:1px;height:1px;overflow:hidden}
.erreur{margin-top:16px;border-left:3px solid var(--rouge);padding:2px 0 2px 12px;font-size:14px}

.bouton{display:flex;align-items:center;justify-content:center;gap:14px;width:100%;min-height:62px;margin-top:20px;padding:0 10px 0 24px;border:0;border-radius:2px;cursor:pointer;background:var(--rouge);color:var(--blanc);text-decoration:none;font-family:var(--font-ui);font-weight:600;font-size:14px;letter-spacing:.12em;text-transform:uppercase;transition:transform .2s ease}
.bouton .fleche{display:grid;place-items:center;width:42px;height:42px;background:var(--noir);flex:none}
.bouton .fleche .i{width:18px;height:18px;stroke:var(--blanc)}
.bouton:hover{transform:translateY(-1px)}
.bouton[aria-busy="true"]{cursor:wait;opacity:.85}
@media (max-width:519px){ .bouton{font-size:13px;letter-spacing:.08em;padding-left:18px;gap:10px} }

/* ---------- Confirmation ---------- */
.merci{text-align:center;outline:none}
.rond{width:64px;height:64px;margin:0 auto;display:grid;place-items:center;background:var(--rouge)}
.rond .i{width:28px;height:28px;stroke-width:2.5}
.merci h2{margin-top:20px;font-size:clamp(28px, 7vw, 36px)}
.merci .quand{margin:14px auto 0;max-width:40ch;font-weight:600;font-size:17px;line-height:1.5}
.important{margin-top:22px;padding:16px 18px;border-left:3px solid var(--rouge);background:var(--surface-2);text-align:left;font-size:15px;line-height:1.55}
.important b{display:block;margin-bottom:4px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--blanc)}

.pied{margin-top:36px;text-align:center;font-size:12px;line-height:1.6;color:var(--texte-3)}
.pied a{color:var(--texte-2)}

[hidden]{display:none !important}
@media (prefers-reduced-motion:reduce){ *{transition:none !important;animation:none !important} }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-fleche" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
  <symbol id="i-coche" viewBox="0 0 24 24"><path d="M5 12l5 5L20 7"/></symbol>
</svg>

<main class="page">
  <header class="tete">
    <div class="profil"><img src="/img/anthony-profil.webp" alt="" width="84" height="84" onerror="this.remove()"></div>
    <p class="etiquette">Équipe Anthony Sirius</p>
    <h1>Réserve ton <span class="aplat">appel.</span></h1>
    <p class="chapo">Laisse tes coordonnées : un membre de l’équipe d’Anthony t’appelle.</p>
  </header>

  <section class="carte" id="etapeInfos" aria-labelledby="titreInfos">
    <h2 id="titreInfos">Tes coordonnées</h2>

    <form id="form" novalidate>
      <div class="deux">
        <div class="champ">
          <label for="firstName">Prénom</label>
          <input class="saisie" type="text" id="firstName" autocomplete="given-name" maxlength="80" required>
        </div>
        <div class="champ">
          <label for="lastName">Nom</label>
          <input class="saisie" type="text" id="lastName" autocomplete="family-name" maxlength="80" required>
        </div>
      </div>
      <div class="champ">
        <label for="email">E-mail</label>
        <input class="saisie" type="email" id="email" autocomplete="email" inputmode="email" maxlength="160" placeholder="ton@email.com" required>
      </div>
      <div class="champ">
        <label for="phone">Numéro WhatsApp</label>
        <div class="tel">
          <select class="saisie" id="country" aria-label="Indicatif du pays"></select>
          <input class="saisie" type="tel" id="phone" autocomplete="tel-national" inputmode="tel" placeholder="6 12 34 56 78" maxlength="20" required>
        </div>
        <p class="indice" id="telApercu"></p>
      </div>

      <label class="consent" id="consentBloc">
        <input type="checkbox" id="consent" required>
        <span>J’accepte d’être appelé par l’équipe d’Anthony Sirius. Les appels peuvent être enregistrés. <a href="https://lpsirius.vercel.app/legal#confidentialite" target="_blank" rel="noopener">Politique de confidentialité</a></span>
      </label>

      <!-- Champ leurre : un robot le remplit, un humain ne le voit pas. -->
      <div class="hp" aria-hidden="true"><label>Société <input type="text" id="company" tabindex="-1" autocomplete="off"></label></div>

      <p class="erreur" id="erreur" role="alert" hidden></p>
      <button type="submit" class="bouton" id="envoyer">Envoyer <span class="fleche"><svg class="i"><use href="#i-fleche"/></svg></span></button>
    </form>
  </section>

  <section class="carte merci" id="merci" tabindex="-1" aria-live="polite" hidden>
    <div class="rond"><svg class="i"><use href="#i-coche"/></svg></div>
    <h2 id="merciTitre">Merci !</h2>
    <p class="quand" id="merciQuand"></p>
    <p class="important"><b>Important</b><span id="merciImportant"></span></p>
  </section>

  <p class="pied">Anthony Sirius — IA Money Club • 2026<br>Les résultats dépendent de ton travail. Aucun résultat n’est garanti.</p>
</main>

<script>
/* ============================================================
   CONFIG — le même projet Supabase que la page de vente et le CRM.
   ============================================================ */
var SUPABASE_URL      = 'https://mmpazpnzkmianenkfyiv.supabase.co';
var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1tcGF6cG56a21pYW5lbmtmeWl2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMzMDgwOTcsImV4cCI6MjEwODg4NDA5N30.UhmwlOXXjj-q6MB1qR_uBNCd7anEkgYdk2Egp_9R6RA';

/* La nuit (heure de Paris), personne n'appelle : de 23 h à 9 h, le message
   dit « demain matin » au lieu de « dans les minutes à suivre ». */
var NUIT = { debut: 23, fin: 9 };

/* Indicatifs (repris de la page de vente) : le numéro part au format
   E.164, comme celui du formulaire. */
var PAYS = [
  ['FR','France','33'],        ['BE','Belgique','32'],      ['CH','Suisse','41'],
  ['LU','Luxembourg','352'],   ['MC','Monaco','377'],       ['CA','Canada','1'],
  ['US','États-Unis','1'],     ['MA','Maroc','212'],        ['DZ','Algérie','213'],
  ['TN','Tunisie','216'],      ['SN','Sénégal','221'],      ['CI','Côte d\'Ivoire','225'],
  ['CM','Cameroun','237'],     ['CD','RD Congo','243'],     ['CG','Congo','242'],
  ['GA','Gabon','241'],        ['ML','Mali','223'],         ['BF','Burkina Faso','226'],
  ['NE','Niger','227'],        ['TG','Togo','228'],         ['BJ','Bénin','229'],
  ['GN','Guinée','224'],       ['MG','Madagascar','261'],   ['MU','Maurice','230'],
  ['RE','La Réunion','262'],   ['GP','Guadeloupe','590'],   ['MQ','Martinique','596'],
  ['GF','Guyane','594'],       ['PF','Polynésie fr.','689'],['NC','Nouvelle-Calédonie','687'],
  ['HT','Haïti','509'],        ['ES','Espagne','34'],       ['PT','Portugal','351'],
  ['IT','Italie','39'],        ['DE','Allemagne','49'],     ['AT','Autriche','43'],
  ['NL','Pays-Bas','31'],      ['GB','Royaume-Uni','44'],   ['IE','Irlande','353'],
  ['DK','Danemark','45'],      ['SE','Suède','46'],         ['NO','Norvège','47'],
  ['FI','Finlande','358'],     ['PL','Pologne','48'],       ['RO','Roumanie','40'],
  ['GR','Grèce','30'],         ['TR','Turquie','90'],       ['IL','Israël','972'],
  ['AE','Émirats arabes unis','971'], ['SA','Arabie saoudite','966'], ['QA','Qatar','974'],
  ['EG','Égypte','20'],        ['ZA','Afrique du Sud','27'],['NG','Nigéria','234'],
  ['AO','Angola','244'],       ['BW','Botswana','267'],     ['BI','Burundi','257'],
  ['CV','Cap-Vert','238'],     ['KM','Comores','269'],      ['DJ','Djibouti','253'],
  ['ER','Érythrée','291'],     ['SZ','Eswatini','268'],     ['ET','Éthiopie','251'],
  ['GM','Gambie','220'],       ['GH','Ghana','233'],        ['GQ','Guinée équatoriale','240'],
  ['GW','Guinée-Bissau','245'],['KE','Kenya','254'],        ['LS','Lesotho','266'],
  ['LR','Liberia','231'],      ['LY','Libye','218'],        ['MW','Malawi','265'],
  ['MR','Mauritanie','222'],   ['MZ','Mozambique','258'],   ['NA','Namibie','264'],
  ['UG','Ouganda','256'],      ['CF','Centrafrique','236'], ['RW','Rwanda','250'],
  ['ST','Sao Tomé-et-Principe','239'], ['SC','Seychelles','248'], ['SL','Sierra Leone','232'],
  ['SO','Somalie','252'],      ['SD','Soudan','249'],       ['SS','Soudan du Sud','211'],
  ['TZ','Tanzanie','255'],     ['TD','Tchad','235'],        ['ZM','Zambie','260'],
  ['ZW','Zimbabwe','263'],
  ['BR','Brésil','55'],        ['MX','Mexique','52'],       ['AU','Australie','61'],
  ['TH','Thaïlande','66'],     ['SG','Singapour','65'],     ['ID','Indonésie','62'],
  ['CN','Chine','86'],         ['JP','Japon','81'],         ['KR','Corée du Sud','82'],
  ['IN','Inde','91'],          ['PK','Pakistan','92'],      ['BD','Bangladesh','880'],
  ['LK','Sri Lanka','94'],     ['NP','Népal','977'],        ['VN','Viêt Nam','84'],
  ['PH','Philippines','63'],   ['MY','Malaisie','60'],      ['KH','Cambodge','855'],
  ['LA','Laos','856'],         ['MM','Myanmar','95'],       ['HK','Hong Kong','852'],
  ['TW','Taïwan','886'],       ['MO','Macao','853'],        ['MN','Mongolie','976'],
  ['BN','Brunei','673'],       ['TL','Timor oriental','670'],['MV','Maldives','960'],
  ['BT','Bhoutan','975'],      ['AF','Afghanistan','93'],   ['IR','Iran','98'],
  ['IQ','Irak','964'],         ['JO','Jordanie','962'],     ['LB','Liban','961'],
  ['SY','Syrie','963'],        ['KW','Koweït','965'],       ['BH','Bahreïn','973'],
  ['OM','Oman','968'],         ['YE','Yémen','967'],        ['PS','Palestine','970'],
  ['KZ','Kazakhstan','7'],     ['UZ','Ouzbékistan','998'],  ['KG','Kirghizistan','996'],
  ['TJ','Tadjikistan','992'],  ['TM','Turkménistan','993'], ['AZ','Azerbaïdjan','994'],
  ['AM','Arménie','374'],      ['GE','Géorgie','995'],      ['CY','Chypre','357']
];
var ZERO_GARDE = ['225', '39'];
function versE164(indicatif, brut){
  var chiffres = String(brut).replace(/\D/g, '');
  if (ZERO_GARDE.indexOf(String(indicatif)) === -1) chiffres = chiffres.replace(/^0+/, '');
  return chiffres ? '+' + indicatif + chiffres : '';
}

(function(){
  var $ = function(id){ return document.getElementById(id); };
  function suivre(nom){ if (window.va) window.va('event', { name: nom }); }
  var envoiEnCours = false;

  /* ---------------- Le téléphone ---------------- */
  var sel = $('country'), tel = $('phone');
  PAYS.forEach(function(p){
    var o = document.createElement('option');
    o.value = p[2]; o.textContent = p[0] + ' +' + p[2]; o.setAttribute('data-pays', p[1]);
    sel.appendChild(o);
  });
  sel.value = '33';
  function e164(){ return versE164(sel.value, tel.value); }
  function majApercu(){
    var o = sel.options[sel.selectedIndex], n = e164();
    $('telApercu').textContent = (o ? o.getAttribute('data-pays') : '') + ' · ' + (n || 'saisis ton numéro sans l’indicatif');
  }
  sel.addEventListener('change', majApercu); tel.addEventListener('input', majApercu); majApercu();

  /* ---------------- L'heure de Paris ---------------- */
  function heureParis(){
    var h = new Intl.DateTimeFormat('fr-FR', { timeZone: 'Europe/Paris', hour: 'numeric', hourCycle: 'h23' })
      .formatToParts(new Date()).filter(function(p){ return p.type === 'hour'; })[0];
    return h ? parseInt(h.value, 10) : 12;
  }
  function laNuit(){ var h = heureParis(); return h >= NUIT.debut || h < NUIT.fin; }

  /* ---------------- L'envoi ---------------- */
  function montrer(texte){ $('erreur').textContent = texte; $('erreur').hidden = false; }

  /* Le lead va dans les Leads du jour de l'équipe Base44 (valeurs par défaut
     de la base : equipe = starter, vivier = formulaire), marqué offre = skool :
     le CRM lui met la pastille « Skool ». */
  function envoyerLead(){
    var params = new URLSearchParams(location.search);
    var corps = {
      first_name: $('firstName').value.trim(),
      last_name:  $('lastName').value.trim(),
      email:      $('email').value.trim(),
      phone:      e164(),
      page_url:   location.href.slice(0, 300),
      source:     params.get('ref') || params.get('src') || document.referrer.slice(0, 300) || 'skool',
      offre:      'skool'
    };
    return fetch(SUPABASE_URL + '/rest/v1/leads', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON_KEY,
                 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY, 'Prefer': 'return=minimal' },
      body: JSON.stringify(corps)
    }).then(function(r){
      if (r.ok) return;
      return r.text().then(function(t){ console.error('Supabase a refusé le lead :', r.status, t); throw new Error('supabase'); });
    });
  }

  $('form').addEventListener('submit', function(e){
    e.preventDefault();
    if (envoiEnCours) return;
    $('erreur').hidden = true;
    var manque = null;
    ['firstName', 'lastName', 'email', 'phone'].forEach(function(id){
      var el = $(id), v = el.value.trim();
      var ok = id === 'email' ? /^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/.test(v)
             : id === 'phone' ? e164().replace(/\D/g, '').length >= 8
             : v.length > 0;
      el.classList.toggle('invalide', !ok);
      if (!ok && !manque) manque = el;
    });
    if (manque){ manque.focus(); return montrer('Vérifie les champs en rouge.'); }
    if (!$('consent').checked){
      $('consentBloc').classList.add('manque');
      return montrer('Coche la case pour qu’on puisse t’appeler.');
    }
    if ($('company').value) return confirmer();   // un robot : rien n'est envoyé

    envoiEnCours = true;
    var bouton = $('envoyer'), libelle = bouton.innerHTML;
    bouton.setAttribute('aria-busy', 'true'); bouton.textContent = 'Envoi…';

    envoyerLead().then(function(){
      suivre('Réservation Skool · envoyé');
      if (window.fbq) window.fbq('track', 'Lead');
      confirmer();
    }).catch(function(){
      montrer('L’envoi n’est pas passé. Vérifie ta connexion et réessaie.');
    }).then(function(){
      envoiEnCours = false;
      bouton.removeAttribute('aria-busy'); bouton.innerHTML = libelle;
    });
  });

  $('consent').addEventListener('change', function(){ if (this.checked) $('consentBloc').classList.remove('manque'); });

  /* ---------------- Merci ---------------- */
  function confirmer(){
    if (laNuit()){
      $('merciTitre').textContent = 'Merci beaucoup !';
      $('merciQuand').textContent = 'Un membre de l’équipe t’appellera dès demain matin.';
      $('merciImportant').textContent = 'En attendant, ne prends surtout pas l’abonnement sur Base44.';
    } else {
      $('merciTitre').textContent = 'Merci !';
      $('merciQuand').textContent = 'Un membre de mon équipe va t’appeler dans les minutes à suivre.';
      $('merciImportant').textContent = 'Ne prends surtout pas l’abonnement à Base44 avant l’appel avec l’équipe.';
    }
    $('etapeInfos').hidden = true;
    $('merci').hidden = false; $('merci').focus();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
})();
</script>
